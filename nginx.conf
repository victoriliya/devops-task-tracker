# Nginx = a fast web server. This config serves our React build.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React is a "single page app": every URL should load index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simple endpoint the pipeline / load balancer can use to check the app is up
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
